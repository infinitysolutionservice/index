<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AINA — Facturation</title>

     par preload.js sur window.html2canvas / window.jspdf / window.XLSX -->

<style>
:root{
  --ink:#1f2f45;
  --ink-2:#2c4363;
  --ink-soft:#496788;
  --brass:#a9812f;
  --brass-light:#c9a35a;
  --brass-pale:#efe4c9;
  --paper:#faf8f4;
  --paper-2:#f1ede3;
  --line:#ddd5c3;
  --text:#262420;
  --text-muted:#75705f;
  --success:#3f6e4e;
  --success-bg:#e5efe6;
  --danger:#a3402a;
  --danger-bg:#f6e6e0;
  --warning:#a1741f;
  --warning-bg:#f6ecd6;
  --sidebar-w:236px;
  --serif: Georgia, 'Palatino Linotype', 'Book Antiqua', 'Iowan Old Style', serif;
  --sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
  --mono: 'SF Mono', 'Consolas', 'Menlo', monospace;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;height:100%;}
body{
  font-family:var(--sans);
  color:var(--text);
  background:var(--paper-2);
  -webkit-font-smoothing:antialiased;
}
#app{display:flex;min-height:100vh;}

/* ---------- Sidebar ---------- */
#sidebar{
  width:var(--sidebar-w);
  flex-shrink:0;
  background:linear-gradient(180deg,var(--ink) 0%, var(--ink-2) 100%);
  color:#e9edf3;
  display:flex;
  flex-direction:column;
  padding:22px 14px;
  position:sticky;
  top:0;
  height:100vh;
  overflow-y:auto;
}
#sidebar .brand{
  display:flex;
  align-items:center;
  gap:10px;
  padding:6px 10px 22px 10px;
  border-bottom:1px solid rgba(255,255,255,0.12);
  margin-bottom:14px;
}
#sidebar .brand-logo{
  width:38px;height:38px;border-radius:50%;
  background:var(--brass);
  display:flex;align-items:center;justify-content:center;
  font-family:var(--serif);
  font-weight:700;color:var(--ink);
  font-size:15px;
  overflow:hidden;
  flex-shrink:0;
}
#sidebar .brand-logo img{width:100%;height:100%;object-fit:cover;}
#sidebar .brand-text .name{font-family:var(--serif);font-size:15px;letter-spacing:0.02em;line-height:1.2;}
#sidebar .brand-text .tag{font-size:10px;letter-spacing:0.12em;text-transform:uppercase;color:var(--brass-light);margin-top:2px;}
.nav-group-label{
  font-size:10px;text-transform:uppercase;letter-spacing:0.12em;
  color:#8fa1ba; margin:16px 10px 6px 10px;
}
.nav-item{
  display:flex;align-items:center;gap:10px;
  padding:9px 10px;margin:1px 0;border-radius:8px;
  cursor:pointer;font-size:13.5px;color:#d7dee8;
  transition:background .12s ease, color .12s ease;
  user-select:none;
}
.nav-item:hover{background:rgba(255,255,255,0.07);color:#fff;}
.nav-item.active{background:var(--brass);color:var(--ink);font-weight:600;}
.nav-item .ic{width:18px;text-align:center;font-size:14px;flex-shrink:0;}

/* ---------- Main ---------- */
#main{flex:1;min-width:0;padding:26px 34px 60px 34px;}
.page-head{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:22px;flex-wrap:wrap;gap:10px;}
.page-head h1{font-family:var(--serif);font-size:25px;margin:0;color:var(--ink);}
.page-head .sub{color:var(--text-muted);font-size:13px;margin-top:3px;}
.btn{
  border:none;border-radius:7px;padding:9px 16px;font-size:13px;font-weight:600;
  cursor:pointer;display:inline-flex;align-items:center;gap:7px;
  transition:transform .08s ease, box-shadow .12s ease, background .12s ease;
  font-family:var(--sans);
}
.btn:active{transform:translateY(1px);}
.btn-brass{background:var(--brass);color:#fff;}
.btn-brass:hover{background:var(--brass-light);}
.btn-ink{background:var(--ink);color:#fff;}
.btn-ink:hover{background:var(--ink-2);}
.btn-ghost{background:transparent;color:var(--ink);border:1px solid var(--line);}
.btn-ghost:hover{background:var(--paper-2);}
.btn-danger{background:transparent;color:var(--danger);border:1px solid var(--danger);}
.btn-danger:hover{background:var(--danger-bg);}
.btn-sm{padding:5px 10px;font-size:12px;border-radius:6px;}
.btn:disabled{opacity:.45;cursor:not-allowed;}

.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:20px 22px;margin-bottom:18px;}
.card h2{font-family:var(--serif);font-size:16px;margin:0 0 14px 0;color:var(--ink);}
.grid{display:grid;gap:14px;}
.grid-2{grid-template-columns:1fr 1fr;}
.grid-3{grid-template-columns:1fr 1fr 1fr;}
label{display:block;font-size:11.5px;font-weight:600;color:var(--text-muted);text-transform:uppercase;letter-spacing:.04em;margin-bottom:5px;}
input[type=text],input[type=number],input[type=email],input[type=date],input[type=tel],select,textarea{
  width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:7px;font-size:13.5px;
  font-family:var(--sans);color:var(--text);background:#fff;
}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--brass);box-shadow:0 0 0 3px var(--brass-pale);}
textarea{resize:vertical;min-height:60px;}
.field{margin-bottom:0;}
.hint{font-size:11.5px;color:var(--text-muted);margin-top:4px;}

table.data{width:100%;border-collapse:collapse;font-size:13px;}
table.data th{
  text-align:left;font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;
  color:var(--text-muted);padding:8px 10px;border-bottom:2px solid var(--line);font-weight:700;
}
table.data td{padding:9px 10px;border-bottom:1px solid var(--paper-2);vertical-align:middle;}
table.data tr:hover td{background:var(--paper-2);}
.badge{display:inline-block;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:700;letter-spacing:.02em;}
.badge-brouillon{background:#eee;color:#666;}
.badge-envoyee{background:var(--warning-bg);color:var(--warning);}
.badge-payee{background:var(--success-bg);color:var(--success);}
.badge-impayee{background:var(--danger-bg);color:var(--danger);}
.icon-btn{background:none;border:none;cursor:pointer;font-size:14px;padding:4px 6px;border-radius:5px;color:var(--ink-soft);}
.icon-btn:hover{background:var(--paper-2);}
.empty-state{text-align:center;padding:50px 20px;color:var(--text-muted);}
.empty-state .big{font-size:34px;margin-bottom:10px;}

/* stat cards */
.stat-row{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:20px;}
.stat{background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px 18px;position:relative;overflow:hidden;}
.stat::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--brass);}
.stat .label{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--text-muted);}
.stat .value{font-family:var(--serif);font-size:24px;color:var(--ink);margin-top:4px;}

/* modal */
.modal-overlay{position:fixed;inset:0;background:rgba(31,47,69,0.45);display:flex;align-items:center;justify-content:center;z-index:1000;padding:20px;}
.modal{background:#fff;border-radius:12px;max-width:480px;width:100%;padding:24px 26px;max-height:88vh;overflow-y:auto;}
.modal h3{font-family:var(--serif);margin:0 0 16px 0;color:var(--ink);font-size:18px;}
.modal .row-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:18px;}

/* ---------- Invoice workspace (split) ---------- */
.workspace{display:grid;grid-template-columns:minmax(360px,460px) 1fr;gap:20px;align-items:start;}
@media (max-width:1100px){.workspace{grid-template-columns:1fr;}}
.lines-table{width:100%;border-collapse:collapse;font-size:12.5px;}
.lines-table th{font-size:10px;text-transform:uppercase;color:var(--text-muted);padding:6px 4px;text-align:left;border-bottom:1px solid var(--line);}
.lines-table td{padding:4px 3px;vertical-align:middle;}
.lines-table input{padding:6px 7px;font-size:12.5px;}
.lines-table .qty-col{width:52px;}
.lines-table .price-col{width:100px;}
.lines-table .total-col{width:100px;color:var(--text-muted);font-family:var(--mono);}
.lines-table .del-col{width:30px;}

/* preview pane */
.preview-wrap{background:#e9e4d6;border-radius:12px;padding:22px;display:flex;flex-direction:column;align-items:center;position:sticky;top:20px;}
.preview-toolbar{display:flex;gap:8px;margin-bottom:14px;width:100%;justify-content:flex-end;flex-wrap:wrap;}
.a4-shell{width:100%;max-width:560px;overflow:hidden;}
#invoice-preview-page{
  width:794px;min-height:1123px;background:#fff;margin:0 auto;
  box-shadow:0 6px 24px rgba(0,0,0,0.18);
  transform-origin:top left;
  position:relative;
  padding:46px 52px;
  font-family:var(--serif);
  color:#232019;
}
.zoom-scale{transform:scale(0.705);}

/* Invoice document styling */
.inv-watermark{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%) rotate(-32deg);font-size:90px;font-weight:700;color:#000;pointer-events:none;white-space:nowrap;z-index:0;}
.inv-content{position:relative;z-index:1;}
.inv-header{display:flex;justify-content:space-between;align-items:flex-start;border-bottom:3px double var(--doc-ink,#1f2f45);padding-bottom:14px;margin-bottom:18px;}
.inv-header .logo-block{display:flex;gap:12px;align-items:center;}
.inv-header .logo-block img{max-height:70px;max-width:150px;object-fit:contain;}
.inv-company-name{font-size:20px;font-weight:700;color:var(--doc-ink,#1f2f45);letter-spacing:.02em;}
.inv-company-meta{font-size:10.5px;color:#5c584c;margin-top:3px;line-height:1.5;}
.inv-meta-right{text-align:right;font-size:11px;color:#5c584c;}
.inv-meta-right .num{font-family:var(--serif);font-size:15px;color:var(--doc-ink,#1f2f45);font-weight:700;margin-bottom:5px;letter-spacing:.03em;}
.inv-seal-ring{display:inline-flex;align-items:center;justify-content:center;width:20px;height:20px;border:1.5px solid var(--doc-brass,#a9812f);border-radius:50%;font-size:9px;margin-right:5px;}
.inv-title-row{display:flex;justify-content:space-between;margin:18px 0 14px 0;font-size:12px;}
.inv-client-box{border:1px solid #ddd5c3;border-radius:6px;padding:10px 14px;max-width:280px;}
.inv-client-box .lbl{font-size:9.5px;text-transform:uppercase;letter-spacing:.06em;color:#8f8a78;margin-bottom:4px;}
.inv-object{font-size:12.5px;margin:14px 0 16px 0;font-style:italic;color:#3a362d;}
table.inv-table{width:100%;border-collapse:collapse;font-size:12px;margin-bottom:16px;}
table.inv-table thead th{background:var(--doc-ink,#1f2f45);color:#fff;padding:8px 10px;text-align:left;font-size:10.5px;text-transform:uppercase;letter-spacing:.04em;}
table.inv-table thead th.num{text-align:right;}
table.inv-table tbody td{padding:7px 10px;border-bottom:1px solid #eee7d6;}
table.inv-table tbody td.num{text-align:right;font-family:var(--mono);}
.inv-totals{display:flex;justify-content:flex-end;margin-bottom:16px;}
.inv-totals table{border-collapse:collapse;font-size:12.5px;min-width:260px;}
.inv-totals td{padding:5px 10px;}
.inv-totals td.lbl{color:#5c584c;}
.inv-totals td.val{text-align:right;font-family:var(--mono);}
.inv-totals tr.ttc td{border-top:2px solid var(--doc-ink,#1f2f45);font-weight:700;font-size:14px;color:var(--doc-ink,#1f2f45);}
.inv-words{border:1px dashed var(--doc-brass,#a9812f);border-radius:6px;padding:9px 13px;font-size:11.5px;font-style:italic;background:#fbf8ef;margin-bottom:26px;}
.inv-sign{display:flex;justify-content:flex-end;margin-bottom:30px;}
.inv-sign-box{text-align:center;font-size:11.5px;}
.inv-sign-box .seal{width:64px;height:64px;border:2px solid var(--doc-brass,#a9812f);border-radius:50%;margin:8px auto 6px auto;display:flex;align-items:center;justify-content:center;font-size:8px;color:var(--doc-brass,#a9812f);text-transform:uppercase;letter-spacing:.05em;line-height:1.3;}
.inv-footer{position:absolute;bottom:30px;left:52px;right:52px;border-top:1px solid #ddd5c3;padding-top:9px;font-size:9.5px;color:#8f8a78;text-align:center;}

@media print{
  body *{visibility:hidden;}
  #invoice-preview-page, #invoice-preview-page *{visibility:visible;}
  #invoice-preview-page{position:absolute;top:0;left:0;box-shadow:none;transform:none;}
  #sidebar,#main>*{display:none;}
}

.color-swatch{width:34px;height:34px;border-radius:8px;border:1px solid var(--line);cursor:pointer;display:inline-block;}
.tab-strip{display:flex;gap:6px;margin-bottom:18px;border-bottom:1px solid var(--line);}
.tab-strip .tab{padding:9px 14px;font-size:13px;cursor:pointer;color:var(--text-muted);border-bottom:2px solid transparent;font-weight:600;}
.tab-strip .tab.active{color:var(--ink);border-color:var(--brass);}
.pill-toggle{display:inline-flex;border:1px solid var(--line);border-radius:20px;overflow:hidden;}
.pill-toggle span{padding:6px 14px;font-size:12px;cursor:pointer;color:var(--text-muted);font-weight:600;}
.pill-toggle span.active{background:var(--ink);color:#fff;}
.search-bar{display:flex;gap:10px;margin-bottom:14px;}
.search-bar input{flex:1;}
</style>

/* ============================================================
   AINA — Application de facturation
   ============================================================ */
const MOIS_FR = ["janvier","février","mars","avril","mai","juin","juillet","août","septembre","octobre","novembre","décembre"];

function pad3(n){ return String(n).padStart(3,"0"); }
function todayISO(){ const d=new Date(); return d.toISOString().slice(0,10); }
function fmtDateFR(iso){
  if(!iso) return "";
  const [y,m,d] = iso.split("-");
  return `${d}/${m}/${y}`;
}
function fmtFCFA(n){
  n = Math.round(Number(n)||0);
  return n.toLocaleString("fr-FR").replace(/\u202f|\u00a0/g," ") + " FCFA";
}
function fmtNum(n){
  n = Math.round(Number(n)||0);
  return n.toLocaleString("fr-FR").replace(/\u202f|\u00a0/g," ");
}
function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,8); }

/* ---------- Conversion nombre -> lettres (français) ---------- */
function unitesToWords(n, noPluralVingt) {
  const unites = ["zéro","un","deux","trois","quatre","cinq","six","sept","huit","neuf","dix",
    "onze","douze","treize","quatorze","quinze","seize","dix-sept","dix-huit","dix-neuf"];
  const dizaines = ["","","vingt","trente","quarante","cinquante","soixante","soixante-dix","quatre-vingt","quatre-vingt-dix"];
  if (n < 20) return unites[n];
  if (n < 70) {
    const d = Math.floor(n/10), u = n%10;
    if (u === 0) return dizaines[d];
    if (u === 1 && d !== 8) return dizaines[d] + "-et-un";
    return dizaines[d] + "-" + unites[u];
  }
  if (n < 80) {
    const u = n - 60;
    if (u === 11) return "soixante-et-onze";
    return "soixante-" + unites[u];
  }
  if (n < 100) {
    const u = n - 80;
    if (u === 0) return "quatre-vingt" + (noPluralVingt ? "" : "s");
    return "quatre-vingt-" + unites[u];
  }
  return "";
}
function centainesToWords(n, noPluralFinal) {
  if (n < 100) return unitesToWords(n, noPluralFinal);
  const c = Math.floor(n/100), r = n%100;
  let words = "";
  if (c === 1) words = "cent";
  else words = unitesToWords(c) + " cent" + (r === 0 && c > 1 && !noPluralFinal ? "s" : "");
  if (r > 0) words += " " + unitesToWords(r, noPluralFinal && r === 80 ? true : false);
  return words.trim();
}
function numberToWordsFR(num) {
  num = Math.floor(Math.abs(Number(num)||0));
  if (num === 0) return "zéro";
  const groups = [];
  let n = num;
  while (n > 0) { groups.unshift(n % 1000); n = Math.floor(n / 1000); }
  const scales = ["", "mille", "million", "milliard", "billion"];
  const totalGroups = groups.length;
  let parts = [];
  for (let i = 0; i < totalGroups; i++) {
    const groupVal = groups[i];
    const scaleIndex = totalGroups - i - 1;
    if (groupVal === 0) continue;
    let groupWords;
    if (scaleIndex === 1) {
      groupWords = groupVal === 1 ? "mille" : centainesToWords(groupVal, true) + " mille";
    } else if (scaleIndex >= 2) {
      const scaleName = scales[scaleIndex];
      const plural = groupVal > 1 ? "s" : "";
      groupWords = centainesToWords(groupVal) + " " + scaleName + plural;
    } else {
      groupWords = centainesToWords(groupVal);
    }
    parts.push(groupWords);
  }
  return parts.join(" ").replace(/\s+/g, " ").trim();
}
function montantEnLettres(n){
  n = Math.round(Number(n)||0);
  const words = numberToWordsFR(n);
  const cap = words.charAt(0).toUpperCase() + words.slice(1);
  return `${cap} francs CFA`;
}

    const keys = ["settings","customization","taxDefaults","clients","prestations","invoices","counter"];
    for(const k of keys){
      try{
        const res = await window.storage.get(k, false);
        if(res && res.value !== undefined){
          this.state[k] = JSON.parse(res.value);
        }
      }catch(e){ /* key not found — keep default */ }
    }
  },
  async save(key){
    try{
      await window.storage.set(key, JSON.stringify(this.state[key]), false);
    }catch(e){ console.error("Erreur de sauvegarde", key, e); }
  },

  goto(view){
    this.view = view;
    this.draft = null;
    this.renderSidebar();
    this.renderView();
    window.scrollTo(0,0);
  }
};

function escapeHtml(str){
  if(str===undefined||str===null) return "";
  return String(str).replace(/[&<>"']/g, m => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
}

/* ============================================================
   Dashboard
   ============================================================ */
App.renderDashboard = function(){
  const invs = this.state.invoices;
  const now = new Date();
  const thisMonthKey = `${now.getFullYear()}-${now.getMonth()+1}`;
  let totalTTCmois = 0, impayees = 0, brouillons = 0, payees = 0;
  let totalHTglobal = 0, totalTVAglobal = 0, totalTTCglobal = 0;
  for(const inv of invs){
    const t = computeTotals(inv);
    if(String(inv.annee) === String(now.getFullYear()) && Number(inv.mois) === now.getMonth()+1){
      totalTTCmois += t.ttc;
    }
    totalHTglobal += t.htva;
    totalTVAglobal += t.tva;
    totalTTCglobal += t.ttc;
    if(inv.statut === "impayee") impayees++;
    if(inv.statut === "brouillon") brouillons++;
    if(inv.statut === "payee") payees++;
  }
  const recent = [...invs].sort((a,b)=> (b.dateCreation||"").localeCompare(a.dateCreation||"")).slice(0,6);

  let rows = recent.map(inv=>{
    const t = computeTotals(inv);
    const client = this.state.clients.find(c=>c.id===inv.clientId);
    return `<tr onclick="App.openInvoice('${inv.id}')" style="cursor:pointer">
      <td><strong>N°${inv.numero}</strong></td>
      <td>${escapeHtml(client?client.nom:"—")}</td>
      <td>${fmtDateFR(inv.dateEmission)}</td>
      <td class="num" style="text-align:right;font-family:var(--mono)">${fmtFCFA(t.ttc)}</td>
      <td>${statusBadge(inv.statut)}</td>
    </tr>`;
  }).join("");
  if(!recent.length){
    rows = `<tr><td colspan="5"><div class="empty-state"><div class="big">🗂️</div>Aucune facture pour le moment.</div></td></tr>`;
  }

  document.getElementById("main").innerHTML = `
    <div class="page-head">
      <div>
        <h1>Tableau de bord</h1>
        <div class="sub">Vue d'ensemble de votre activité de facturation</div>
      </div>
      <button class="btn btn-brass" onclick="App.goto('newInvoice')">＋ Nouvelle facture</button>
    </div>
    <div class="stat-row">
      <div class="stat"><div class="label">Total des factures</div><div class="value">${invs.length}</div></div>
      <div class="stat"><div class="label">Total TTC — ${MOIS_FR[now.getMonth()]}</div><div class="value">${fmtFCFA(totalTTCmois)}</div></div>
      <div class="stat"><div class="label">Factures payées</div><div class="value">${payees}</div></div>
      <div class="stat"><div class="label">Factures impayées</div><div class="value">${impayees}</div></div>
    </div>
    <div class="stat-row">
      <div class="stat"><div class="label">Total HT (toutes factures)</div><div class="value">${fmtFCFA(totalHTglobal)}</div></div>
      <div class="stat"><div class="label">Total TVA (toutes factures)</div><div class="value">${fmtFCFA(totalTVAglobal)}</div></div>
      <div class="stat"><div class="label">Total TTC (toutes factures)</div><div class="value">${fmtFCFA(totalTTCglobal)}</div></div>
      <div class="stat"><div class="label">Factures en brouillon</div><div class="value">${brouillons}</div></div>
    </div>
    <div class="card">
      <h2>Factures récentes</h2>
      <table class="data">
        <thead><tr><th>Numéro</th><th>Client</th><th>Date</th><th style="text-align:right">Total TTC</th><th>Statut</th></tr></thead>
        <tbody>${rows}</tbody>
      </table>
    </div>
  `;
};

function statusBadge(statut){
  const labels = {brouillon:"Brouillon", envoyee:"Envoyée", payee:"Payée", impayee:"Impayée"};
  return `<span class="badge badge-${statut}">${labels[statut]||statut}</span>`;
}

function computeTotals(inv){
  const lignes = inv.lignes||[];
  let htva = 0;
  for(const l of lignes){ htva += (Number(l.quantite)||0) * (Number(l.prixUnitaire)||0); }
  let extra = 0;
  for(const e of (inv.extraCharges||[])){
    const amt = Number(e.amount)||0;
    extra += e.type === "remise" ? -amt : amt;
  }
  const baseApresExtra = htva + extra;
  const tva = inv.tvaActive ? baseApresExtra * (Number(inv.tvaTaux)||0)/100 : 0;
  const ttc = baseApresExtra + tva;
  return {htva, extra, tva, ttc: Math.round(ttc), baseApresExtra};
}

  this.renderView();
};

};

/* ============================================================
   Taxes & TVA (valeurs par défaut)
   ============================================================ */
App.renderTaxes = function(){
  const t = this.state.taxDefaults;
  let rows = (t.extraTemplates||[]).map((e,i)=>`
    <tr>
      <td>${escapeHtml(e.label)}</td>
      <td>${e.type==='remise'?'Remise (-)':'Frais / taxe (+)'}</td>
      <td style="font-family:var(--mono)">${fmtFCFA(e.amount)}</td>
      <td><button class="icon-btn" onclick="App.removeTaxTemplate(${i})">🗑</button></td>
    </tr>`).join("");
  if(!(t.extraTemplates||[]).length) rows = `<tr><td colspan="4" style="color:var(--text-muted);text-align:center;padding:16px;">Aucun frais additionnel par défaut</td></tr>`;

  document.getElementById("main").innerHTML = `
    <div class="page-head"><div><h1>Taxes &amp; TVA</h1><div class="sub">Valeurs par défaut proposées à la création d'une facture — modifiables facture par facture</div></div></div>
    <div class="card">
      <h2>TVA</h2>
      <label style="display:flex;align-items:center;gap:8px;text-transform:none;font-size:13px;">
        <input type="checkbox" style="width:auto" ${t.tvaActiveDefault?'checked':''} onchange="App.setTaxDefault('tvaActiveDefault', this.checked)"> Activer la TVA par défaut sur les nouvelles factures
      </label>
      <div class="field" style="max-width:200px;margin-top:12px;"><label>Taux de TVA par défaut (%)</label><input type="number" value="${t.tvaTauxDefault}" onchange="App.setTaxDefault('tvaTauxDefault', this.value)"></div>
    </div>
    <div class="card">
      <h2>Frais &amp; remises additionnels par défaut</h2>
      <table class="data">
        <thead><tr><th>Libellé</th><th>Type</th><th>Montant</th><th></th></tr></thead>
        <tbody>${rows}</tbody>
      </table>
      <div class="grid grid-3" style="margin-top:14px;align-items:end;">
        <div class="field"><label>Libellé</label><input type="text" id="tax-label" placeholder="Ex : Frais de service"></div>
        <div class="field"><label>Type</label>
          <select id="tax-type"><option value="frais">Frais / taxe (+)</option><option value="remise">Remise (-)</option></select>
        </div>
        <div class="field"><label>Montant (FCFA)</label><input type="number" id="tax-amount" placeholder="0"></div>
      </div>
      <div style="margin-top:12px;"><button class="btn btn-ghost btn-sm" onclick="App.addTaxTemplate()">＋ Ajouter</button></div>
    </div>
  `;
};
App.setTaxDefault = function(key,value){
  this.state.taxDefaults[key] = (key==='tvaActiveDefault') ? value : Number(value);
  this.save("taxDefaults");
};
App.addTaxTemplate = function(){
  const label = document.getElementById("tax-label").value.trim();
  const type = document.getElementById("tax-type").value;
  const amount = Number(document.getElementById("tax-amount").value)||0;
  if(!label){ alert("Le libellé est requis."); return; }
  this.state.taxDefaults.extraTemplates = this.state.taxDefaults.extraTemplates||[];
  this.state.taxDefaults.extraTemplates.push({label,type,amount});
  this.save("taxDefaults");
  this.renderView();
};
App.removeTaxTemplate = function(i){
  this.state.taxDefaults.extraTemplates.splice(i,1);
  this.save("taxDefaults");
  this.renderView();
};

/* ============================================================
   Base de données & Sauvegarde
   ============================================================ */
App.renderDatabaseSection = async function(){
  let info = {dbPath:"", backupsDir:""};
  let lastBackup = null;
  let backups = [];
  try{
    info = await window.dbTools.dbInfo();
    lastBackup = await window.dbTools.lastBackupDate();
    backups = await window.dbTools.listBackups();
  }catch(e){ console.error(e); }

  const lastBackupTxt = lastBackup
    ? new Date(lastBackup).toLocaleString("fr-FR")
    : "Aucune sauvegarde pour le moment";

  const backupRows = backups.slice(0,8).map(b=>`
    <tr>
      <td>${escapeHtml(b.fileName)}</td>
      <td>${new Date(b.mtime).toLocaleString("fr-FR")}</td>
      <td>${(b.size/1024).toFixed(0)} Ko</td>
    </tr>`).join("");

  document.getElementById("main").innerHTML = `
    <div class="page-head">
      <div><h1>Base de données &amp; Sauvegarde</h1><div class="sub">Vos données sont enregistrées localement sur cet ordinateur, hors ligne</div></div>
    </div>

    <div class="card">
      <h2>État actuel</h2>
      <div class="hint" style="margin-bottom:6px;">Fichier de la base : <strong>${escapeHtml(info.dbPath)}</strong></div>
      <div class="hint" style="margin-bottom:6px;">Dossier des sauvegardes : <strong>${escapeHtml(info.backupsDir)}</strong></div>
      <div class="hint">📅 Dernière sauvegarde : <strong>${lastBackupTxt}</strong></div>
      <div class="hint" style="margin-top:6px;">🔄 Une sauvegarde automatique est créée avant chaque modification importante (factures) et une fois par jour à l'ouverture du logiciel.</div>
    </div>

    <div class="card">
      <h2>Actions</h2>
      <div style="display:flex;flex-wrap:wrap;gap:10px;">
        <button class="btn btn-brass" onclick="App.dbBackupNow()">💾 Sauvegarder maintenant</button>
        <button class="btn btn-ghost" onclick="App.dbRestoreBackup()">📥 Restaurer une sauvegarde</button>
        <button class="btn btn-ghost" onclick="App.dbExportCopy()">📤 Exporter une copie de la base</button>
        <button class="btn btn-ghost" onclick="App.dbExportJSON()">📤 Exporter toutes les données (JSON)</button>
        <button class="btn btn-ghost" onclick="App.dbImportJSON()">📂 Importer les données (JSON)</button>
        <button class="btn btn-danger" onclick="App.dbResetDatabase()">🗑️ Réinitialiser la base de données</button>
      </div>
    </div>

    <div class="card">
      <h2>Sauvegardes récentes</h2>
      <table class="data">
        <thead><tr><th>Fichier</th><th>Date</th><th>Taille</th></tr></thead>
        <tbody>${backupRows || `<tr><td colspan="3"><div class="empty-state"><div class="big">💾</div>Aucune sauvegarde pour le moment.</div></td></tr>`}</tbody>
      </table>
    </div>
  `;
};

App.dbBackupNow = async function(){
  try{
    const res = await window.dbTools.backupNow();
    toast(`Sauvegarde créée : ${res.fileName}`);
    this.renderView();
  }catch(e){ console.error(e); alert("La sauvegarde a échoué."); }
};

App.dbRestoreBackup = async function(){
  if(!confirm("Restaurer une sauvegarde remplacera TOUTES les données actuelles par celles de la sauvegarde choisie.\n\nUne sauvegarde de sécurité de la base actuelle sera créée automatiquement avant l'opération.\n\nContinuer ?")) return;
  try{
    const res = await window.dbTools.restoreBackupDialog();
    if(res.canceled) return;
    alert("Sauvegarde restaurée avec succès. Le logiciel va se recharger.");
    location.reload();
  }catch(e){ console.error(e); alert("La restauration a échoué : " + e.message); }
};

App.dbExportCopy = async function(){
  try{
    const res = await window.dbTools.exportCopyDialog();
    if(res.canceled) return;
    toast("Copie de la base exportée");
  }catch(e){ console.error(e); alert("L'export a échoué."); }
};

App.dbExportJSON = async function(){
  try{
    const res = await window.dbTools.exportJSONDialog();
    if(res.canceled) return;
    toast("Export JSON terminé");
  }catch(e){ console.error(e); alert("L'export JSON a échoué."); }
};

App.dbImportJSON = async function(){
  if(!confirm("Importer un fichier remplacera TOUTES les données actuelles par celles du fichier choisi.\n\nUne sauvegarde de sécurité sera créée automatiquement avant l'opération.\n\nContinuer ?")) return;
  try{
    const res = await window.dbTools.importJSONDialog();
    if(res.canceled) return;
    alert("Import terminé avec succès. Le logiciel va se recharger.");
    location.reload();
  }catch(e){ console.error(e); alert("L'import a échoué : " + e.message); }
};

App.dbResetDatabase = async function(){
  if(!confirm("⚠️ ATTENTION : cette action va supprimer DÉFINITIVEMENT toutes les données (clients, prestations, factures, paramètres).\n\nUne sauvegarde de sécurité sera tout de même créée automatiquement avant.\n\nVoulez-vous vraiment continuer ?")) return;
  if(!confirm("Deuxième confirmation : êtes-vous VRAIMENT sûr(e) de vouloir réinitialiser toute la base de données ? Cette action est irréversible.")) return;
  try{
    await window.dbTools.resetDatabase();
    alert("La base de données a été réinitialisée. Le logiciel va se recharger.");
    location.reload();
  }catch(e){ console.error(e); alert("La réinitialisation a échoué : " + e.message); }
};

function toast(msg){
  const el = document.createElement("div");
  el.textContent = msg;
  el.style.cssText = "position:fixed;bottom:24px;right:24px;background:var(--ink);color:#fff;padding:11px 18px;border-radius:8px;font-size:13px;z-index:2000;box-shadow:0 6px 18px rgba(0,0,0,.25);";
  document.body.appendChild(el);
  setTimeout(()=>el.remove(), 2200);
}

/* ============================================================
   Nouvelle facture / édition — cœur de l'application
   ============================================================ */
App.newDraftInvoice = function(){
  const now = new Date();
  const tax = this.state.taxDefaults;
  return {
    id: uid(),
    numero: pad3(this.state.counter + 1),
    dateEmission: todayISO(),
    mois: now.getMonth()+1,
    annee: now.getFullYear(),
    clientId: this.state.clients.length ? this.state.clients[0].id : "",
    objetPrefix: "Gardiennage",
    objetManual: false,
    objetCustom: "",
    lignes: [{id:uid(), designation:"", quantite:1, prixUnitaire:0}],
    tvaActive: !!tax.tvaActiveDefault,
    tvaTaux: tax.tvaTauxDefault||18,
    extraCharges: (tax.extraTemplates||[]).map(e=>({id:uid(), label:e.label, type:e.type, amount:e.amount})),
    statut: "brouillon",
    dateCreation: new Date().toISOString(),
    isNew: true
  };
};

App.openInvoice = function(id){
  const inv = this.state.invoices.find(i=>i.id===id);
  if(!inv) return;
  this.draft = JSON.parse(JSON.stringify(inv));
  this.draft.isNew = false;
  this.view = "newInvoice";
  this.renderSidebar();
  this.renderInvoiceForm();
};

App.duplicateInvoice = function(id){
  const inv = this.state.invoices.find(i=>i.id===id);
  if(!inv) return;
  const copy = JSON.parse(JSON.stringify(inv));
  copy.id = uid();
  copy.numero = pad3(this.state.counter + 1);
  copy.dateEmission = todayISO();
  let m = Number(copy.mois)+1, y = Number(copy.annee);
  if(m > 12){ m = 1; y += 1; }
  copy.mois = m; copy.annee = y;
  copy.statut = "brouillon";
  copy.dateCreation = new Date().toISOString();
  copy.isNew = true;
  if(!copy.objetManual){
    copy.objetCustom = "";
  }
  this.draft = copy;
  this.view = "newInvoice";
  this.renderSidebar();
  this.renderInvoiceForm();
  toast("Facture dupliquée — vérifiez les informations avant d'enregistrer");
};

function objetTexte(draft){
  if(draft.objetManual) return draft.objetCustom||"";
  const moisNom = MOIS_FR[(Number(draft.mois)||1)-1];
  return `${draft.objetPrefix||""} du mois de ${moisNom} ${draft.annee}`.trim();
}

App.renderInvoiceForm = function(){
  if(!this.draft) this.draft = this.newDraftInvoice();
  const d = this.draft;
  const clients = this.state.clients;
  const prestations = this.state.prestations;

  const clientOptions = clients.map(c=>`<option value="${c.id}" ${d.clientId===c.id?'selected':''}>${escapeHtml(c.nom)}</option>`).join("");
  const monthOptions = MOIS_FR.map((m,i)=>`<option value="${i+1}" ${Number(d.mois)===i+1?'selected':''}>${m}</option>`).join("");
  const yearNow = new Date().getFullYear();
  let yearOptions = "";
  for(let y=yearNow-2; y<=yearNow+3; y++) yearOptions += `<option value="${y}" ${Number(d.annee)===y?'selected':''}>${y}</option>`;

  const prestationDatalist = prestations.map(p=>`<option value="${escapeAttr(p.designation)}" data-price="${p.prixUnitaire}">`).join("");

  const linesRows = d.lignes.map(l=>`
    <tr>
      <td><input type="text" list="prestation-list" value="${escapeAttr(l.designation)}" placeholder="Désignation" oninput="App.updateLine('${l.id}','designation',this.value)" onchange="App.autoFillPrice('${l.id}',this.value)"></td>
      <td class="qty-col"><input type="number" min="0" value="${l.quantite}" oninput="App.updateLine('${l.id}','quantite',this.value)"></td>
      <td class="price-col"><input type="number" min="0" value="${l.prixUnitaire}" oninput="App.updateLine('${l.id}','prixUnitaire',this.value)"></td>
      <td class="total-col">${fmtNum((Number(l.quantite)||0)*(Number(l.prixUnitaire)||0))}</td>
      <td class="del-col"><button class="icon-btn" onclick="App.removeLine('${l.id}')">✕</button></td>
    </tr>`).join("");

  const extraRows = (d.extraCharges||[]).map(e=>`
    <tr>
      <td><input type="text" value="${escapeAttr(e.label)}" oninput="App.updateExtra('${e.id}','label',this.value)"></td>
      <td style="width:120px">
        <select onchange="App.updateExtra('${e.id}','type',this.value)">
          <option value="frais" ${e.type==='frais'?'selected':''}>Frais (+)</option>
          <option value="remise" ${e.type==='remise'?'selected':''}>Remise (-)</option>
        </select>
      </td>
      <td class="price-col"><input type="number" value="${e.amount}" oninput="App.updateExtra('${e.id}','amount',this.value)"></td>
      <td class="del-col"><button class="icon-btn" onclick="App.removeExtra('${e.id}')">✕</button></td>
    </tr>`).join("");

  document.getElementById("main").innerHTML = `
    <datalist id="prestation-list">${prestationDatalist}</datalist>
    <div class="page-head">
      <div><h1>${d.isNew===false?'Modifier la facture':'Nouvelle facture'} N°${d.numero}</h1><div class="sub">Remplissez le formulaire — l'aperçu à droite se met à jour instantanément</div></div>
      <div style="display:flex;gap:8px;">
        <button class="btn btn-ghost" onclick="App.goto('invoices')">Annuler</button>
      </div>
    </div>
    <div class="workspace">
      <div>
        <div class="card">
          <h2>Client &amp; période</h2>
          <div class="grid" style="gap:12px;">
            <div class="field">
              <label>Client</label>
              <select id="f-client" onchange="App.onFieldChange('clientId', this.value)">
                <option value="">— Sélectionner —</option>
                ${clientOptions}
              </select>
              <div class="hint"><a href="#" onclick="App.openClientModal();return false;" style="color:var(--ink-soft)">＋ Créer un nouveau client</a></div>
            </div>
            <div class="grid grid-3">
              <div class="field"><label>Mois de prestation</label><select id="f-mois" onchange="App.onFieldChange('mois', this.value)">${monthOptions}</select></div>
              <div class="field"><label>Année</label><select id="f-annee" onchange="App.onFieldChange('annee', this.value)">${yearOptions}</select></div>
              <div class="field"><label>Date d'émission</label><input type="date" id="f-date" value="${d.dateEmission}" onchange="App.onFieldChange('dateEmission', this.value)"></div>
            </div>
            <div class="field"><label>Numéro de facture</label><input type="text" id="f-numero" value="${escapeAttr(d.numero)}" onchange="App.onFieldChange('numero', this.value)"></div>
            <div class="field">
              <label style="display:flex;justify-content:space-between;align-items:center;">
                <span>Objet de la facture</span>
                <span style="text-transform:none;font-weight:400;font-size:11.5px;">
                  <label style="display:inline-flex;align-items:center;gap:5px;margin:0;text-transform:none;"><input type="checkbox" style="width:auto" ${d.objetManual?'checked':''} onchange="App.toggleObjetManual(this.checked)"> personnaliser</label>
                </span>
              </label>
              ${d.objetManual
                ? `<input type="text" id="f-objet-custom" value="${escapeAttr(d.objetCustom)}" oninput="App.updateObjetCustom(this.value)">`
                : `<div class="grid grid-2">
                     <input type="text" id="f-objet-prefix" value="${escapeAttr(d.objetPrefix)}" placeholder="Ex : Gardiennage" onchange="App.onFieldChange('objetPrefix', this.value)">
                     <div style="display:flex;align-items:center;color:var(--text-muted);font-size:12.5px;padding:0 4px;">du mois de ${MOIS_FR[(Number(d.mois)||1)-1]} ${d.annee}</div>
                   </div>`
              }
            </div>
          </div>
        </div>

        <div class="card">
          <h2>Prestations</h2>
          <table class="lines-table">
            <thead><tr><th>Désignation</th><th>Qté</th><th>Prix unit.</th><th>Total</th><th></th></tr></thead>
            <tbody id="lines-tbody">${linesRows}</tbody>
          </table>
          <button class="btn btn-ghost btn-sm" style="margin-top:8px;" onclick="App.addLine()">＋ Ajouter une ligne</button>
        </div>

        <div class="card">
          <h2>TVA &amp; frais additionnels</h2>
          <label style="display:flex;align-items:center;gap:8px;text-transform:none;font-size:13px;">
            <input type="checkbox" style="width:auto" ${d.tvaActive?'checked':''} onchange="App.onFieldChange('tvaActive', this.checked)"> Appliquer la TVA
          </label>
          ${d.tvaActive ? `<div class="field" style="max-width:160px;margin-top:10px;"><label>Taux (%)</label><input type="number" value="${d.tvaTaux}" onchange="App.onFieldChange('tvaTaux', this.value)"></div>` : ""}
          <table class="lines-table" style="margin-top:14px;">
            <thead><tr><th>Libellé</th><th>Type</th><th>Montant</th><th></th></tr></thead>
            <tbody id="extra-tbody">${extraRows}</tbody>
          </table>
          <button class="btn btn-ghost btn-sm" style="margin-top:8px;" onclick="App.addExtra()">＋ Ajouter un frais / remise</button>
        </div>

        <div class="card">
          <h2>Statut &amp; enregistrement</h2>
          <div class="field" style="max-width:220px;">
            <label>Statut</label>
            <select id="f-statut" onchange="App.onFieldChange('statut', this.value)">
              <option value="brouillon" ${d.statut==='brouillon'?'selected':''}>Brouillon</option>
              <option value="envoyee" ${d.statut==='envoyee'?'selected':''}>Envoyée</option>
              <option value="payee" ${d.statut==='payee'?'selected':''}>Payée</option>
              <option value="impayee" ${d.statut==='impayee'?'selected':''}>Impayée</option>
            </select>
          </div>
          <div style="display:flex;gap:10px;margin-top:16px;flex-wrap:wrap;">
            <button class="btn btn-brass" onclick="App.saveInvoice()">💾 Enregistrer la facture</button>
          </div>
        </div>
      </div>

      <div class="preview-wrap">
        <div class="preview-toolbar">
          <button class="btn btn-ghost btn-sm" onclick="App.togglePreviewZoom()" id="zoom-btn">🔍 Zoom</button>
          <button class="btn btn-ghost btn-sm" onclick="App.printInvoice()">🖨️ Imprimer</button>
          <button class="btn btn-ghost btn-sm" onclick="App.exportPDF()">⬇ PDF</button>
          <button class="btn btn-ghost btn-sm" onclick="App.exportWord()">⬇ Word</button>
          <button class="btn btn-ghost btn-sm" onclick="App.exportExcel()">⬇ Excel</button>
        </div>
        <div class="a4-shell" id="a4-shell">
          <div id="invoice-preview-page" class="zoom-scale"></div>
        </div>
      </div>
    </div>
  `;
  this.zoomed = this.zoomed===undefined ? true : this.zoomed;
  this.updatePreview();
};

App.togglePreviewZoom = function(){
  const el = document.getElementById("invoice-preview-page");
  this.zoomed = !this.zoomed;
  el.classList.toggle("zoom-scale", this.zoomed);
  this.adjustPreviewShellHeight();
};

App.onFieldChange = function(field, value){
  this.draft[field] = (field==='tvaActive') ? value : value;
  if(field==='mois' || field==='annee') this.draft[field] = Number(value);
  if(field==='tvaTaux') this.draft[field] = Number(value);
  if(['mois','annee','clientId','tvaActive','statut'].includes(field)){
    this.renderInvoiceForm();
  } else {
    this.updatePreview();
  }
};
App.toggleObjetManual = function(checked){
  this.draft.objetManual = checked;
  if(checked && !this.draft.objetCustom) this.draft.objetCustom = objetTexte(this.draft);
  this.renderInvoiceForm();
};
App.updateObjetCustom = function(value){
  this.draft.objetCustom = value;
  this.updatePreview();
};

App.updateLine = function(id, field, value){
  const l = this.draft.lignes.find(x=>x.id===id);
  if(!l) return;
  l[field] = (field==='designation') ? value : Number(value);
  this.updatePreview();
  this.updateLineTotalDisplay(id);
};
App.updateLineTotalDisplay = function(id){
  const l = this.draft.lignes.find(x=>x.id===id);
  const rows = document.querySelectorAll("#lines-tbody tr");
  const idx = this.draft.lignes.findIndex(x=>x.id===id);
  if(rows[idx]){
    const cell = rows[idx].querySelector(".total-col");
    if(cell) cell.textContent = fmtNum((Number(l.quantite)||0)*(Number(l.prixUnitaire)||0));
  }
};
App.autoFillPrice = function(id, designationValue){
  const p = this.state.prestations.find(pr=>pr.designation===designationValue);
  if(p){
    const l = this.draft.lignes.find(x=>x.id===id);
    if(l && (!l.prixUnitaire || l.prixUnitaire===0)){
      l.prixUnitaire = p.prixUnitaire;
      this.renderInvoiceForm();
    }
  }
};
App.addLine = function(){
  this.draft.lignes.push({id:uid(), designation:"", quantite:1, prixUnitaire:0});
  this.renderInvoiceForm();
};
App.removeLine = function(id){
  this.draft.lignes = this.draft.lignes.filter(l=>l.id!==id);
  this.renderInvoiceForm();
};
App.updateExtra = function(id, field, value){
  const e = this.draft.extraCharges.find(x=>x.id===id);
  if(!e) return;
  e[field] = (field==='amount') ? Number(value) : value;
  this.updatePreview();
};
App.addExtra = function(){
  this.draft.extraCharges = this.draft.extraCharges||[];
  this.draft.extraCharges.push({id:uid(), label:"Frais", type:"frais", amount:0});
  this.renderInvoiceForm();
};
App.removeExtra = function(id){
  this.draft.extraCharges = this.draft.extraCharges.filter(e=>e.id!==id);
  this.renderInvoiceForm();
};

/* ============================================================
   Aperçu de la facture (rendu HTML A4)
   ============================================================ */
App.updatePreview = function(){
  const d = this.draft;
  // Facture déjà enregistrée : on fige son apparence (logo, couleurs, coordonnées)
  // telle qu'elle était au moment de sa création — elle ne doit jamais changer
  // automatiquement si les paramètres actuels de l'entreprise changent ensuite.
  const snap = (d && !d.isNew && d._snapshot) ? d._snapshot : null;
  const s = snap ? snap.settings : this.state.settings;
  const c = snap ? snap.customization : this.state.customization;
  const client = this.state.clients.find(x=>x.id===d.clientId);
  const totals = computeTotals(d);
  const inkColor = c.primaryColor || "#1f2f45";
  const brassColor = c.brassColor || "#a9812f";
  const fontFamily = c.font==='sans' ? "var(--sans)" : "var(--serif)";
  const logoPos = c.logoPosition||"left";
  const logoAlign = logoPos==='center'?'center':(logoPos==='right'?'flex-end':'flex-start');

  const linesHtml = (d.lignes||[]).map(l=>`
    <tr>
      <td class="num">${fmtNum(l.quantite)}</td>
      <td>${escapeHtml(l.designation)||"<span style='color:#bbb'>—</span>"}</td>
      <td class="num">${fmtFCFA(l.prixUnitaire)}</td>
      <td class="num">${fmtFCFA((Number(l.quantite)||0)*(Number(l.prixUnitaire)||0))}</td>
    </tr>`).join("");

  const extraHtml = (d.extraCharges||[]).filter(e=>e.amount).map(e=>`
    <tr><td class="lbl">${escapeHtml(e.label)}${e.type==='remise'?' (remise)':''}</td><td class="val">${e.type==='remise'?'-':''}${fmtFCFA(e.amount)}</td></tr>
  `).join("");

  const objet = objetTexte(d);
  const watermarkHtml = c.watermarkEnabled ? `<div class="inv-watermark" style="opacity:${(c.watermarkOpacity||6)/100};font-size:${c.watermarkSize||90}px;color:${inkColor}">${escapeHtml(c.watermarkText||"")}</div>` : "";
  const logoHeight = c.logoSize||70;

  document.getElementById("invoice-preview-page").innerHTML = `
    <div style="--doc-ink:${inkColor};--doc-brass:${brassColor};font-family:${fontFamily};height:100%;">
      ${watermarkHtml}
      <div class="inv-content">
        <div class="inv-header" style="border-color:${inkColor};justify-content:${logoPos==='center'?'center':'space-between'};flex-wrap:wrap;">
          <div class="logo-block" style="justify-content:${logoAlign};${logoPos==='center'?'width:100%;flex-direction:column;text-align:center;margin-bottom:10px;':''}">
            ${s.logoDataUrl ? `<img src="${s.logoDataUrl}" style="height:${logoHeight}px;max-width:180px;object-fit:contain;">` : ""}
            <div>
              <div class="inv-company-name" style="color:${inkColor}">${escapeHtml(s.companyName||"")}</div>
              <div class="inv-company-meta">
                ${s.arrete?`Arrêté ministériel n° ${escapeHtml(s.arrete)}<br>`:""}
                ${s.ninea?`NINEA : ${escapeHtml(s.ninea)}<br>`:""}
                ${s.address?`${escapeHtml(s.address)}<br>`:""}
                ${s.phone?`Tél : ${escapeHtml(s.phone)} `:""}${s.email?` — ${escapeHtml(s.email)}`:""}
              </div>
            </div>
          </div>
          ${logoPos!=='center' ? `
          <div class="inv-meta-right">
            <div class="num">FACTURE N° ${escapeHtml(d.numero)}</div>
            Dakar, le ${fmtDateFR(d.dateEmission)}
          </div>` : ""}
        </div>

        <div class="inv-title-row">
          <div class="inv-client-box">
            <div class="lbl">Facturé à</div>
            <strong>${client?escapeHtml(client.nom):"—"}</strong><br>
            ${client&&client.adresse?escapeHtml(client.adresse)+"<br>":""}
            ${client&&client.responsable?"À l'attention de : "+escapeHtml(client.responsable)+"<br>":""}
            ${client&&client.ninea?"NINEA : "+escapeHtml(client.ninea):""}
          </div>
          ${logoPos==='center' ? `<div class="inv-meta-right"><div class="num">FACTURE N° ${escapeHtml(d.numero)}</div>Dakar, le ${fmtDateFR(d.dateEmission)}</div>` : ""}
        </div>

        <div class="inv-object">Objet : ${escapeHtml(objet)}</div>

        <table class="inv-table">
          <thead><tr style="background:${inkColor}"><th>Qté</th><th>Désignation</th><th class="num">Prix unitaire</th><th class="num">Prix total</th></tr></thead>
          <tbody>${linesHtml || '<tr><td colspan="4" style="text-align:center;color:#bbb;padding:14px;">Aucune prestation ajoutée</td></tr>'}</tbody>
        </table>

        <div class="inv-totals">
          <table>
            <tr><td class="lbl">Total HTVA</td><td class="val">${fmtFCFA(totals.htva)}</td></tr>
            ${extraHtml}
            ${d.tvaActive ? `<tr><td class="lbl">TVA (${d.tvaTaux}%)</td><td class="val">${fmtFCFA(totals.tva)}</td></tr>` : ""}
            <tr class="ttc" style="border-color:${inkColor}"><td class="lbl" style="color:${inkColor}">Total TTC</td><td class="val" style="color:${inkColor}">${fmtFCFA(totals.ttc)}</td></tr>
          </table>
        </div>

        <div class="inv-words" style="border-color:${brassColor}">Arrêté la présente facture à la somme de : <strong>${montantEnLettres(totals.ttc)}</strong>.</div>

        <div class="inv-sign">
          <div class="inv-sign-box">
            ${escapeHtml(s.responsableFonction||"")}<br>${escapeHtml(s.responsableName||"")}
            <div class="seal" style="border-color:${brassColor};color:${brassColor}">Cachet<br>&amp; signature</div>
          </div>
        </div>

        <div class="inv-footer">
          ${escapeHtml(s.companyName||"")}${s.address?" — "+escapeHtml(s.address):""}${s.phone?" — "+escapeHtml(s.phone):""}${s.email?" — "+escapeHtml(s.email):""}${s.bankInfo?"<br>"+escapeHtml(s.bankInfo):""}
        </div>
      </div>
    </div>
  `;
  this.updateTotalsQuickView && this.updateTotalsQuickView(totals);
  this.adjustPreviewShellHeight();
};

App.adjustPreviewShellHeight = function(){
  const el = document.getElementById("invoice-preview-page");
  const shell = document.getElementById("a4-shell");
  if(!el || !shell) return;
  const scale = el.classList.contains("zoom-scale") ? 0.705 : 1;
  shell.style.height = Math.ceil(el.scrollHeight * scale) + "px";
};

/* ============================================================
   Enregistrement de la facture
   ============================================================ */
App.saveInvoice = function(){
  const d = this.draft;
  if(!d.clientId){ alert("Veuillez sélectionner un client."); return; }
  if(!d.lignes.length || d.lignes.every(l=>!l.designation)){ alert("Ajoutez au moins une prestation."); return; }

  const idx = this.state.invoices.findIndex(i=>i.id===d.id);
  const wasNew = idx === -1;
  delete d.isNew;
  if(wasNew){
    this.state.invoices.push(d);
    const numAsInt = parseInt(d.numero, 10);
    if(!isNaN(numAsInt) && numAsInt > this.state.counter) this.state.counter = numAsInt;
  } else {
    this.state.invoices[idx] = d;
  }
  this.save("invoices");
  this.save("counter");
  toast(`Facture N°${d.numero} enregistrée`);
  this.goto("invoices");
};

/* ============================================================
   Liste des factures / historique
   ============================================================ */
App.renderInvoiceList = function(){
  const q = (this.invoiceListFilter||"").toLowerCase();
  let list = this.state.invoices.map(inv=>{
    const client = this.state.clients.find(c=>c.id===inv.clientId);
    return {inv, client, totals: computeTotals(inv)};
  });
  if(q){
    list = list.filter(({inv,client}) =>
      inv.numero.toLowerCase().includes(q) ||
      (client && client.nom.toLowerCase().includes(q)) ||
      (inv.dateEmission||"").includes(q)
    );
  }
  list.sort((a,b)=> (b.inv.dateCreation||"").localeCompare(a.inv.dateCreation||""));

  let rows = list.map(({inv,client,totals})=>`
    <tr>
      <td><strong>N°${inv.numero}</strong></td>
      <td>${fmtDateFR(inv.dateEmission)}</td>
      <td>${client?escapeHtml(client.nom):"—"}</td>
      <td style="max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${escapeHtml(objetTexte(inv))}</td>
      <td style="text-align:right;font-family:var(--mono)">${fmtFCFA(totals.htva)}</td>
      <td style="text-align:right;font-family:var(--mono)">${inv.tvaActive?fmtFCFA(totals.tva):"—"}</td>
      <td style="text-align:right;font-family:var(--mono);font-weight:700;">${fmtFCFA(totals.ttc)}</td>
      <td>${statusBadge(inv.statut)}</td>
      <td style="white-space:nowrap;">
        <button class="icon-btn" title="Ouvrir" onclick="App.openInvoice('${inv.id}')">✎</button>
        <button class="icon-btn" title="Dupliquer" onclick="App.duplicateInvoice('${inv.id}')">⧉</button>
        <button class="icon-btn" title="Supprimer" onclick="App.deleteInvoice('${inv.id}')">🗑</button>
      </td>
    </tr>`).join("");
  if(!list.length) rows = `<tr><td colspan="9"><div class="empty-state"><div class="big">▤</div>Aucune facture ${q?"ne correspond à votre recherche":"pour le moment"}.</div></td></tr>`;

  document.getElementById("main").innerHTML = `
    <div class="page-head">
      <div><h1>Mes factures</h1><div class="sub">Historique complet, recherche et actions rapides</div></div>
      <button class="btn btn-brass" onclick="App.goto('newInvoice')">＋ Nouvelle facture</button>
    </div>
    <div class="search-bar">
      <input type="text" placeholder="Rechercher par numéro, client ou date..." value="${escapeAttr(this.invoiceListFilter||"")}" oninput="App.filterInvoices(this.value)">
    </div>
    <div class="card">
      <table class="data">
        <thead><tr><th>N°</th><th>Date</th><th>Client</th><th>Objet</th><th style="text-align:right">HTVA</th><th style="text-align:right">TVA</th><th style="text-align:right">TTC</th><th>Statut</th><th></th></tr></thead>
        <tbody>${rows}</tbody>
      </table>
    </div>
  `;
};
App.filterInvoices = function(val){
  this.invoiceListFilter = val;
  this.renderInvoiceList();
};
App.deleteInvoice = function(id){
  if(!confirm("Supprimer définitivement cette facture ?")) return;
  this.state.invoices = this.state.invoices.filter(i=>i.id!==id);
  this.save("invoices");
  this.renderInvoiceList();
};

/* ============================================================
   Exports : PDF, Word, Excel, Impression
   ============================================================ */
App.printInvoice = function(){
  window.print();
};

App.exportPDF = async function(){
  const el = document.getElementById("invoice-preview-page");
  const wasZoomed = el.classList.contains("zoom-scale");
  el.classList.remove("zoom-scale");
  try{
    const canvas = await html2canvas(el, {scale:2, useCORS:true, backgroundColor:"#ffffff"});
    const imgData = canvas.toDataURL("image/jpeg", 0.95);
    const { jsPDF } = window.jspdf;
    const pdf = new jsPDF({unit:"mm", format:"a4", orientation:"portrait"});
    const pageWidth = 210, pageHeight = 297;
    const imgWidth = pageWidth;
    const imgHeight = (canvas.height * imgWidth) / canvas.width;
    let heightLeft = imgHeight, position = 0;
    pdf.addImage(imgData, "JPEG", 0, position, imgWidth, imgHeight);
    heightLeft -= pageHeight;
    while(heightLeft > 0){
      position = heightLeft - imgHeight;
      pdf.addPage();
      pdf.addImage(imgData, "JPEG", 0, position, imgWidth, imgHeight);
      heightLeft -= pageHeight;
    }
    pdf.save(`Facture_${this.draft.numero}.pdf`);
  }catch(e){
    console.error(e);
    alert("Erreur lors de la génération du PDF.");
  } finally {
    if(wasZoomed) el.classList.add("zoom-scale");
  }
};

App.exportWord = function(){
  const el = document.getElementById("invoice-preview-page");
  const html = `
    <html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:w="urn:schemas-microsoft-com:office:word" xmlns="http://www.w3.org/TR/REC-html40">
    <head><meta charset="utf-8"><title>Facture ${this.draft.numero}</title></head>
    <body>${el.innerHTML}</body></html>`;
  const blob = new Blob(['\ufeff', html], {type:"application/msword"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = `Facture_${this.draft.numero}.doc`;
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
};

App.exportExcel = function(){
  const d = this.draft;
  const client = this.state.clients.find(c=>c.id===d.clientId);
  const totals = computeTotals(d);
  const wsData = [
    ["Facture N°", d.numero],
    ["Date", fmtDateFR(d.dateEmission)],
    ["Client", client?client.nom:""],
    ["Objet", objetTexte(d)],
    [],
    ["Désignation","Quantité","Prix unitaire","Prix total"]
  ];
  d.lignes.forEach(l=>{
    wsData.push([l.designation, l.quantite, l.prixUnitaire, (Number(l.quantite)||0)*(Number(l.prixUnitaire)||0)]);
  });
  wsData.push([]);
  wsData.push(["","","Total HTVA", totals.htva]);
  (d.extraCharges||[]).filter(e=>e.amount).forEach(e=>{
    wsData.push(["","", e.label + (e.type==='remise'?" (remise)":""), e.type==='remise'?-e.amount:e.amount]);
  });
  if(d.tvaActive) wsData.push(["","",`TVA (${d.tvaTaux}%)`, totals.tva]);
  wsData.push(["","","Total TTC", totals.ttc]);
  wsData.push([]);
  wsData.push(["Montant en lettres", montantEnLettres(totals.ttc)]);

  const ws = XLSX.utils.aoa_to_sheet(wsData);
  ws["!cols"] = [{wch:28},{wch:14},{wch:16},{wch:16}];
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, "Facture");
  XLSX.writeFile(wb, `Facture_${d.numero}.xlsx`);
};

/* ============================================================
   Démarrage
   ============================================================ */
document.addEventListener("DOMContentLoaded", ()=> App.init());

</script>
